name: split_bill_app
description: A simple offline split-bill app with proportional fee sharing. Android + Web.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.1.0
  path_provider: ^2.0.11
  pdf: ^3.11.0
  printing: ^5.10.0
  share_plus: ^6.3.0
  intl: ^0.18.0
  supabase_flutter: ^2.10.0
  url_launcher: ^6.3.1
  fluttertoast: ^8.2.4
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/config/.env
